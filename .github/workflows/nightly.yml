name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  keepalive:
    # Supabase pauses a Free project after 7 idle days and a paused project takes the site down,
    # so something has to touch Postgres at least weekly. Requesting the real public pages does
    # that through the production app: it warms the Vercel function, exercises the database, and
    # needs no credentials at all. The previous version was gated on a repository variable that
    # was never set, so it had never run once.
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.PRODUCTION_URL || 'https://dataminds-sql-academy.vercel.app' }}
    steps:
      - name: Warm the site and its database
        run: |
          set -euo pipefail
          failed=0
          for path in / /curriculo; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "${SITE_URL}${path}" || echo 000)
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done
          exit $failed
