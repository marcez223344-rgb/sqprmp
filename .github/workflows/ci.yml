name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_key_for_tests
  NEXT_PUBLIC_APP_URL: http://localhost:3100

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:validate
      - run: npm run content:validate
      - name: Content seed must be up to date
        run: |
          npm run content:build
          git diff --exit-code -- supabase/seed/0002_content.sql || (echo '::error::supabase/seed/0002_content.sql drifted; run npm run content:build' && exit 1)
      - run: npm run datasets:verify
      - run: npm run build
      - run: npm audit --audit-level=high

  db-tests:
    name: Supabase pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated types must match src/types/database.ts
        run: |
          supabase gen types typescript --local > /tmp/database.generated.ts
          cp src/types/database.ts /tmp/database.committed.ts
          npx prettier --write /tmp/database.generated.ts /tmp/database.committed.ts > /dev/null
          if ! diff -u /tmp/database.committed.ts /tmp/database.generated.ts; then
            echo "::error::src/types/database.ts drifted from the schema. Run: npx supabase gen types typescript --local > src/types/database.ts"
            exit 1
          fi

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (auth + migrations + seed)
        run: |
          supabase start
          supabase status -o env > .supabase-status.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .supabase-status.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^ANON_KEY=' .supabase-status.env | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SECRET_KEY=$(grep '^SERVICE_ROLE_KEY=' .supabase-status.env | cut -d= -f2- | tr -d '"')"
            echo "E2E_SUPABASE=1"
            # The webhook suite asserts that a bad hottok is rejected with 401, which only
            # happens when the provider is enabled; the token itself is a throwaway test value.
            echo "PAYMENT_PROVIDERS=manual,hotmart"
            echo "HOTMART_WEBHOOK_HOTTOK=e2e-not-a-real-token"
            echo "HOTMART_ENV=sandbox"
            echo "HOTMART_SKIP_REFETCH=true"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
